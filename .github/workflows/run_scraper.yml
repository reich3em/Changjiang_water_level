name: Daily Yangtze River Water Level Scraper

on:
  schedule:
    # 每天 UTC 时间 02:00 运行 (北京时间早上 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上点击按钮手动触发

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入仓库的权限，以便推送更新的 CSV

    steps:
      - name: 检出代码库 (Checkout Repository)
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行爬虫脚本
        run: python scraper.py

      - name: 提交并推送到 GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add yangtze_water_levels.csv
          
          # 如果有改动则 commit，没有则跳过
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: 长江水位数据更新"
          git push
